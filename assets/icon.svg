<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Droid Lite: a phone with code, in Android's brand colours (green #3DDC84, navy #073042).
       Original artwork; it does not use the Android robot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0E4A63"/>
      <stop offset="1" stop-color="#073042"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE89A"/>
      <stop offset="1" stop-color="#2BC772"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px rounded square centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g filter="url(#shadow)">
    <!-- antennae -->
    <g stroke="url(#green)" stroke-width="30" stroke-linecap="round">
      <line x1="420" y1="250" x2="388" y2="196"/>
      <line x1="604" y1="250" x2="636" y2="196"/>
    </g>
    <!-- phone body -->
    <rect x="322" y="240" width="380" height="560" rx="70" fill="url(#green)"/>
    <!-- screen -->
    <rect x="356" y="300" width="312" height="420" rx="28" fill="#073042"/>
    <!-- speaker and home bar -->
    <rect x="474" y="263" width="76" height="14" rx="7" fill="#073042" opacity="0.55"/>
    <rect x="462" y="748" width="100" height="16" rx="8" fill="#073042" opacity="0.55"/>
  </g>
  <!-- </> on the screen -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="34">
    <path d="M462 438 L402 510 L462 582" stroke="#3DDC84"/>
    <path d="M562 438 L622 510 L562 582" stroke="#3DDC84"/>
    <path d="M534 418 L490 602" stroke="#FFFFFF"/>
  </g>
</svg>
