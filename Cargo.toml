[package]
name = "droid-lite"
version = "0.1.0"
edition = "2024"
description = "A light, Mac-first IDE for Android and Jetpack Compose code"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
nucleo-matcher = "0.3"
ignore = "0.4"
rfd = "0.18"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
