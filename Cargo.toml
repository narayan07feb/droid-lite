[package]
name = "droid-lite"
version = "0.1.0"
edition = "2024"
description = "A light, Mac-first IDE for Android and Jetpack Compose code"
license = "MIT"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
nucleo-matcher = "0.3"
ignore = "0.4"
rfd = "0.18"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
raw-window-handle = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSGlassEffectView", "NSResponder", "NSView", "NSWindow"] }

[features]
# `cargo run --release --features memstats -- --bench <project>` also prints the live heap per step
memstats = []
